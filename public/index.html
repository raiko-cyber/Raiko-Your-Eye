<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0E1A">
<title>Raiko-Your Eye</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{
  /* Дизайн для незрячих и слабовидящих:
     - тёмный фон и ярко-жёлтый акцент: контраст текста не ниже 7:1 (уровень WCAG AAA);
     - главная кнопка огромная и стоит первой, микрофон всегда прижат к низу экрана под большим пальцем;
     - у каждой кнопки своя иконка и свой цвет, чтобы узнавать её по пятну, даже не читая;
     - все кнопки не меньше 64 пикселей в высоту. */
  --ink:#070B16;
  --ink-2:#0E1630;
  --panel:#121A30;
  --panel-2:#18223D;
  --line:#2F3B60;
  --signal:#FFD338;
  --signal-deep:#F2B705;
  --paper:#F7F4E8;
  --mute:#BAC3D8;
  --alert:#FF8A66;
  --sky:#8FD3FF;
  --display:"Arial Black","Segoe UI Black",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --r-lg:28px;--r-md:20px;--r-sm:14px;
  color-scheme:dark;
}
@media (prefers-contrast:more){
  :root{--ink:#000;--ink-2:#000;--panel:#000;--panel-2:#000;--line:#F7F4E8;--mute:#F7F4E8}
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  background:
    radial-gradient(120% 60% at 50% -10%, #1B2A5C 0%, rgba(27,42,92,0) 60%),
    radial-gradient(90% 50% at 100% 100%, rgba(255,211,56,.10) 0%, rgba(255,211,56,0) 60%),
    linear-gradient(180deg,var(--ink-2) 0%,var(--ink) 55%);
  background-color:var(--ink);background-attachment:fixed;
  color:var(--paper);font-family:var(--body);font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
:focus-visible{outline:5px solid var(--sky);outline-offset:4px}
button[disabled]{opacity:.45;cursor:default}
svg.i{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

.app{max-width:560px;margin:0 auto;padding:14px 16px 0;display:flex;flex-direction:column;gap:14px}

/* Шапка */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{margin:0;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:900;font-size:1.15rem;letter-spacing:.01em}
.brand .logo{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--signal);color:var(--ink);font-size:24px}
.brand .accent{color:var(--signal)}
.langs{display:flex;padding:4px;gap:4px;border-radius:16px;background:var(--panel);border:2px solid var(--line)}
.langs button{min-width:56px;min-height:48px;padding:0 10px;border-radius:12px;font-weight:800;font-size:.9rem;letter-spacing:.05em;color:var(--mute)}
.langs button[aria-pressed="true"]{color:var(--ink);background:var(--signal)}

/* Камера */
.view{position:relative;height:clamp(130px,34vw,200px);border-radius:var(--r-md);overflow:hidden;background:var(--panel);
  border:2px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35)}
#video{width:100%;height:100%;object-fit:cover;display:block}
.front #video{transform:scaleX(-1)}
.live{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  background:rgba(7,11,22,.78);font-size:.8rem;font-weight:800;letter-spacing:.08em;color:var(--paper)}
.live::before{content:"";width:9px;height:9px;border-radius:50%;background:#FF5A4E}
#flip{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:8px;min-height:52px;padding:0 16px;border-radius:var(--r-sm);
  background:rgba(7,11,22,.88);border:2px solid var(--signal);color:var(--signal);font-weight:800;font-size:.95rem}
#flip svg{font-size:1.3rem}
#camOff{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;text-align:center;
  font-weight:800;color:var(--signal);background:var(--panel)}
#camOff svg{font-size:2rem}

/* Главная кнопка */
.shoot{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:6px;overflow:hidden;
  width:100%;min-height:clamp(170px,46vw,230px);padding:22px;border-radius:var(--r-lg);
  background:linear-gradient(150deg,#FFE173 0%,var(--signal) 45%,var(--signal-deep) 100%);color:var(--ink);text-align:left;
  box-shadow:0 14px 34px rgba(255,211,56,.22), inset 0 -4px 0 rgba(0,0,0,.12)}
.shoot .big{position:absolute;right:-6px;top:-10px;font-size:150px;opacity:.16;stroke-width:2}
.shoot .badge{display:grid;place-items:center;width:58px;height:58px;border-radius:18px;background:var(--ink);color:var(--signal);font-size:32px;margin-bottom:auto}
.shoot-title{font-family:var(--display);font-weight:900;font-size:clamp(1.7rem,8vw,2.4rem);line-height:1.05;text-wrap:balance}
.shoot-hint{font-weight:700;font-size:1.02rem}

/* Две кнопки и «Где я?» */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;min-height:118px;padding:16px;
  border-radius:var(--r-md);background:var(--panel);border:3px solid var(--signal);color:var(--paper);
  font-weight:800;font-size:clamp(1.02rem,4.6vw,1.18rem);line-height:1.2;text-align:left;text-wrap:balance}
.tile svg{font-size:1.9rem;color:var(--signal)}
.where{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;padding:14px 18px;border-radius:var(--r-md);
  background:var(--panel);border:3px solid var(--sky);color:var(--paper);font-weight:800;font-size:clamp(1.08rem,4.8vw,1.22rem);text-align:left}
.where svg{font-size:1.8rem;color:var(--sky)}

/* Ответ */
.result{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:2px solid var(--line);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:12px}
.result-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--line);font-weight:800;font-size:.95rem;color:var(--mute)}
.pill::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--mute)}
.pill[data-state="looking"],.pill[data-state="speaking"]{border-color:var(--signal);color:var(--signal)}
.pill[data-state="looking"]::before,.pill[data-state="speaking"]::before{background:var(--signal)}
.pill[data-state="listening"]{border-color:var(--alert);color:var(--alert)}
.pill[data-state="listening"]::before{background:var(--alert)}
.ctl{display:flex;gap:8px}
.ctl button{display:flex;align-items:center;gap:6px;min-height:48px;padding:0 14px;border:2px solid var(--line);border-radius:var(--r-sm);font-weight:800;font-size:.95rem;background:var(--ink)}
.ctl svg{font-size:1.15rem}
#asked{margin:0;color:var(--mute);font-size:.98rem;overflow-wrap:anywhere}
#answer{margin:0;font-size:1.38rem;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap}
#answer:empty{display:none}

/* Текстовый вопрос и подпись */
.voice{display:flex;gap:10px;flex-wrap:wrap}
#q{flex:1 1 200px;min-width:0;min-height:60px;padding:0 16px;border:2px solid var(--line);border-radius:var(--r-sm);background:var(--panel);font-size:1.08rem}
#q::placeholder{color:var(--mute)}
#send{min-height:60px;padding:0 22px;border-radius:var(--r-sm);border:2px solid var(--signal);color:var(--signal);font-weight:800}
.note{margin:0;color:var(--mute);font-size:.9rem;text-align:center}

/* Микрофон: всегда внизу экрана, под большим пальцем */
.dock{position:sticky;bottom:0;z-index:5;margin:4px -16px 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(7,11,22,0) 0%,rgba(7,11,22,.92) 30%,var(--ink) 100%)}
.dock[hidden]{display:none}
#mic{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:80px;border-radius:var(--r-md);
  background:var(--paper);color:var(--ink);font-family:var(--display);font-weight:900;font-size:1.18rem;box-shadow:0 10px 28px rgba(0,0,0,.45)}
#mic svg{font-size:1.8rem;stroke-width:2.6}
#mic[aria-pressed="true"]{background:var(--alert)}
.spacer{height:4px}

@media (hover:hover){
  .tile:hover,.where:hover,.ctl button:hover{background:var(--panel-2)}
}
.shoot:active,.tile:active,.where:active,#mic:active{transform:scale(.985)}
@media (prefers-reduced-motion:no-preference){
  .shoot,.tile,.where,#mic{transition:transform .12s ease}
  .pill[data-state="looking"]::before,.pill[data-state="listening"]::before{animation:beat 1s ease-in-out infinite}
  #mic[aria-pressed="true"]{animation:ring 1.2s ease-out infinite}
  @keyframes beat{50%{transform:scale(1.7);opacity:.5}}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,138,102,.6)}100%{box-shadow:0 0 0 18px rgba(255,138,102,0)}}
}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none !important}
</style>
</head>
<body>
<!-- Иконки. Скрыты от TalkBack: у каждой кнопки есть текстовая подпись -->

  <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M3 8h3.5l2-3h7l2 3H21v11H3z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
  <symbol id="i-flip" viewBox="0 0 24 24"><path d="M3 8h3.5l2-3h7l2 3H21v11H3z"/><path d="M9 13.5a3 3 0 0 1 5.2-2"/><path d="M15 13.5a3 3 0 0 1-5.2 2"/><path d="M14.5 9.6v2h-2M9.5 17.4v-2h2"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
</svg>
<div class="app">
  <header class="top">
    <h1 class="brand"><span class="logo" aria-hidden="true"><svg class="i"><use href="#i-eye"/></svg></span><span class="name"><span class="accent">Raiko</span>-Your Eye</span></h1>
    <div class="langs" role="group" aria-label="Тіл / Язык / Language">
      <button type="button" id="lang-kk" data-lang="kk" aria-label="Қазақша">ҚАЗ</button>
      <button type="button" id="lang-ru" data-lang="ru" aria-label="Русский">РУС</button>
      <button type="button" id="lang-en" data-lang="en" aria-label="English">ENG</button>
    </div>
  </header>

  <div class="view">
    <video id="video" playsinline muted autoplay aria-hidden="true"></video>
    <span class="live" aria-hidden="true">LIVE</span>
    <button type="button" id="flip" hidden><svg class="i" aria-hidden="true"><use href="#i-flip"/></svg><span id="l-flip"></span></button>
    <button type="button" id="camOff"><svg class="i" aria-hidden="true"><use href="#i-cam"/></svg><span id="l-camOff"></span></button>
  </div>

  <button type="button" class="shoot" id="btn-around" data-mode="around">
    <svg class="i big" aria-hidden="true"><use href="#i-eye"/></svg>
    <span class="badge" aria-hidden="true"><svg class="i"><use href="#i-eye"/></svg></span>
    <span class="shoot-title" id="t-around"></span>
    <span class="shoot-hint" id="t-hint"></span>
  </button>
  <div class="pair">
    <button type="button" class="tile" id="btn-text" data-mode="text"><svg class="i" aria-hidden="true"><use href="#i-text"/></svg><span id="l-text"></span></button>
    <button type="button" class="tile" id="btn-thing" data-mode="thing"><svg class="i" aria-hidden="true"><use href="#i-box"/></svg><span id="l-thing"></span></button>
  </div>
  <button type="button" class="where" id="btn-where"><svg class="i" aria-hidden="true"><use href="#i-pin"/></svg><span id="l-where"></span></button>

  <section class="result" aria-label="Raiko">
    <div class="result-head">
      <!-- Без aria-live: приложение само говорит ответ голосом, а TalkBack читал бы его второй раз поверх -->
      <span class="pill" id="status" data-state="ready"></span>
      <div class="ctl">
        <button type="button" id="repeat" disabled><svg class="i" aria-hidden="true"><use href="#i-repeat"/></svg><span id="l-repeat"></span></button>
        <button type="button" id="stop"><svg class="i" aria-hidden="true"><use href="#i-stop"/></svg><span id="l-stop"></span></button>
      </div>
    </div>
    <p id="asked" hidden></p>
    <p id="answer"></p>
  </section>

  <form class="voice" id="ask">
    <label class="vh" for="q" id="q-label"></label>
    <input id="q" type="text" autocomplete="off" enterkeyhint="send">
    <button type="submit" id="send"></button>
  </form>

  <p class="note" id="note"></p>
  <div class="spacer"></div>

  <div class="dock" id="dock" hidden>
    <button type="button" id="mic" aria-pressed="false"><svg class="i" aria-hidden="true"><use href="#i-mic"/></svg><span id="l-mic"></span></button>
  </div>
  <input class="vh" type="file" id="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
</div>

  /* ---------- управление голосом ---------- */
  function handleVoice(raw){

      if(has(c.stop)){ stopSpeaking(); return; }
      if(has(c.where)){ whereAmI(); return; }
      if(has(c.flip)){ flipCamera(); return; }
      if(has(c.repeat)){ if(lastAnswer) say(lastAnswer); return; }
      if(has(c.text)){ look({mode:"text"}); return; }
